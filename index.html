<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Video Player</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #101010; --card: #161616; --card-hover: #1e1e1e;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #8e8e8e;
    --accent: #E5FF00; --accent-soft: rgba(229,255,0,.07); --chip: #1e1e1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; }

  aside { width: 380px; min-width: 380px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .head { padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
  .head h1 { margin: 0 0 12px; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  .filters { display: grid; gap: 8px; }
  .search-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); transition: border-color .15s; }
  .search-box:focus-within { border-color: var(--text); }
  .search-box.has-value { border-color: var(--accent); }
  .search-box svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search-box input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .search-box input::placeholder { color: var(--muted); }
  .dd-wrap { position: relative; }
  .dd-btn { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; transition: border-color .15s; }
  .dd-btn:hover { border-color: #616161; color: var(--text); }
  .dd-btn.open { border-color: var(--text); color: var(--text); }
  .dd-btn.has-value { border-color: var(--accent); color: var(--text); }
  .dd-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .dd-clear { display: none; align-items: center; justify-content: center; width: 14px; height: 14px; color: #616161; }
  .dd-clear:hover { color: var(--text); }
  .dd-clear svg { width: 10px; height: 10px; }
  .dd-btn.has-value .dd-clear { display: flex; }
  .dd-chevron { width: 16px; height: 16px; flex-shrink: 0; transition: transform .15s; }
  .dd-btn.open .dd-chevron { transform: rotate(180deg); }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 100; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .dd-panel.open { display: flex; }
  .dd-panel.has-search { padding: 8px 4px 4px; }
  .dd-search-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; color: var(--muted); }
  .dd-search-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .dd-search-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .dd-search-input::placeholder { color: var(--muted); }
  .dd-divider { height: 1px; background: var(--border); margin: 2px 8px; }
  .dd-items-scroll { max-height: 380px; overflow-y: auto; }   /* 10 rows x 38px, the rest scrolls */
  .dd-items-scroll::-webkit-scrollbar { width: 4px; }
  .dd-items-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .dd-item { display: flex; align-items: center; gap: 8px; height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .dd-item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-item:hover { background: #1e1e1e; color: var(--text); }
  .dd-item.selected { color: var(--text); }
  .dd-item img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .dd-none { padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .ms-cb { width: 16px; height: 16px; border-radius: 2px; border: 1px solid var(--text); flex-shrink: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dd-item.selected .ms-cb { background: var(--text); }
  .ms-cb svg { display: none; width: 10px; height: 10px; color: var(--card); }
  .dd-item.selected .ms-cb svg { display: block; }
  .filter-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .custom { display: flex; gap: 8px; margin-bottom: 12px; }
  .custom input { flex: 1; min-width: 0; height: 32px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; outline: none; }
  .custom input:focus { border-color: var(--text); }
  .custom input.bad { border-color: #FF364E; }
  .custom button { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  .custom button:hover { filter: brightness(.92); }
  .filter-apply-btn { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  .filter-apply-btn:hover:not(:disabled) { filter: brightness(.92); }
  .filter-apply-btn:disabled { background: var(--border); color: #616161; cursor: default; }
  .filter-clear-btn { height: 32px; padding: 0 8px; background: transparent; border: none; font: inherit; color: var(--accent); cursor: pointer; }
  .filter-clear-btn:hover { text-decoration: underline; }
  .count { margin-left: auto; margin-top: 0; color: var(--muted); font-size: 12px; }
  /* compact header: title + play-by-id on one row, filters on two rows, favorites scroll sideways */
  .head-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .head-row h1 { margin: 0 !important; flex-shrink: 0; }
  .head-row .custom { margin: 0; margin-left: auto; gap: 6px; width: 190px; }
  .head-row .custom input { height: 30px; padding: 0 10px; font-size: 13px; }
  .head-row .custom button { height: 30px; padding: 0 12px; }
  .filters { grid-template-columns: minmax(0, 1fr) auto; }   /* minmax(0,...): a long selected system name can never widen the sidebar */
  .filters > * { min-width: 0; }
  .dd-wrap { min-width: 0; max-width: 100%; }
  aside { max-width: 380px; overflow: hidden; }
  .dd-label { min-width: 0; white-space: nowrap; }
  .filters .search-box { grid-column: 1 / -1; order: -1; }
  .dd-sort .dd-btn { gap: 6px; }
  .dd-sort .dd-panel { left: auto; min-width: 190px; }
  .dd-sort .sort-ic { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); }
  /* favorites: every chip visible at once (no sideways scrolling), big enough for a TV remote */
  .favs { margin: 10px 0 0; }
  .favs-star { display: none; }
  .favs-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .favs-chips .fav { width: 100%; height: 36px; padding: 0 6px 0 4px; gap: 5px; justify-content: flex-start; font-size: 12px; }
  .favs-chips .fav span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .favs-chips .fav img { width: 22px; height: 22px; }
  .fav { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 6px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s; }
  .fav img { width: 20px; height: 20px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .fav:hover:not(:disabled) { border-color: #616161; color: var(--text); }
  .fav.on { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .fav:disabled { opacity: .4; cursor: default; }

  .list, .lang-menu { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .list::-webkit-scrollbar, .lang-menu::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-track, .lang-menu::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb, .lang-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .dd-items-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .dd-sort .dd-label { color: var(--text); }
  .dd-sort .dd-label b { color: var(--muted); font-weight: 500; }
  .dd-sort .dd-item.selected { font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card { text-align: left; width: 100%; background: var(--card); color: inherit; border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; cursor: pointer; font: inherit; transition: background .12s, border-color .12s, transform .12s; }
  /* hover: no movement; a lighter surface, a brighter border and an accent bar on the left edge */
  .card:hover { background: var(--card-hover); border-color: #4a4a4a; box-shadow: inset 3px 0 0 var(--accent); }
  .card.is-live:hover { border-color: rgba(255,54,78,.7); }
  .card.active { border-color: var(--accent); background: var(--accent-soft); }
  .teams { display: flex; gap: 6px; margin-bottom: 9px; }
  .teams { gap: 10px; }
  .teams img { width: 64px; height: 64px; object-fit: contain; background: #ffffff12; border-radius: 50%; padding: 3px; }
  .teams:empty { display: none; }
  .card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }   /* logos + name side by side; the name wraps */
  .card .top .teams { margin-bottom: 0; flex-shrink: 0; gap: 6px; }
  .card .top .teams img { width: 52px; height: 52px; }
  .card .top .title { font-size: 15.5px; }
  .card .top .title { flex: 1; min-width: 0; margin-bottom: 0; }
  .card .meta { flex-wrap: nowrap; overflow: hidden; }   /* date + audio chips stay on one line */
  .card .meta .chip { flex-shrink: 0; }
  .card .meta .chip.lang { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card .title { font-weight: 600; font-size: 14px; margin-bottom: 7px; overflow-wrap: anywhere; }
  /* "Home Vs. Visitor" games: one line per team, logo + name */
  .card .match { display: grid; gap: 6px; margin-bottom: 8px; }
  .card .side { display: flex; align-items: center; gap: 11px; min-width: 0; font-weight: 600; font-size: 15.5px; }
  .card .side .tn { min-width: 0; overflow-wrap: anywhere; }
  .card .side img, .ini { width: 38px; height: 38px; flex-shrink: 0; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; }
  .ini { display: inline-flex; align-items: center; justify-content: center; padding: 0; font-size: 13px; font-weight: 700; letter-spacing: .3px; color: var(--muted); border: 1px solid var(--border); background: #ffffff08; }
  .card .top .teams .ini { width: 52px; height: 52px; font-size: 15px; }
  /* system: a quiet line under the teams */
  .card .system { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; margin-bottom: 8px; min-width: 0; }
  .card .system img { width: 16px; height: 16px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 1px; flex-shrink: 0; }
  .card .system .sn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the game that is in the player */
  .card .now { display: none; margin-left: auto; align-items: center; gap: 5px; flex-shrink: 0; color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .card.active .now { display: inline-flex; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
  .eq i { width: 2px; height: 100%; background: currentColor; transform-origin: bottom; transform: scaleY(.4); }
  body.playing .eq i { animation: eq .8s ease-in-out infinite alternate; }
  body.playing .eq i:nth-child(2) { animation-delay: -.3s; } body.playing .eq i:nth-child(3) { animation-delay: -.55s; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; }
  .chip.lang { color: var(--accent); }
  .chip.date { color: var(--text); }
  .chip.date.today::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 1px; }
  .chip.more { cursor: help; }
  .card { position: relative; }
  .chip.live { position: absolute; top: 10px; right: 10px; z-index: 1; background: #FF364E; color: #fff; font-weight: 700; letter-spacing: .5px; }
  .chip.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 5px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
  .chip.live.soon { background: transparent; color: #FF9F1A; box-shadow: inset 0 0 0 1px #FF9F1A; }
  .chip.live.soon::before { background: #FF9F1A; animation: none; }
  .card.has-badge .match, .card.has-badge .top { padding-right: 58px; }   /* keep the names clear of the corner badge */
  .card.is-live { border-color: rgba(255,54,78,.45); }
  .card.is-live.active { border-color: var(--accent); }
  @keyframes blink { 50% { opacity: .25; } }
  /* remote-control / keyboard navigation (smart TV): a clear focus ring */
  .card:focus-visible, .fav:focus-visible, .dd-btn:focus-visible, .filter-apply-btn:focus-visible, .filter-clear-btn:focus-visible, .custom button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* date group headers (Date sort) */
  .grp { position: sticky; top: -12px; z-index: 2; margin: 0 -12px -4px; padding: 9px 14px 6px; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; display: flex; gap: 6px; }
  .grp b { color: var(--text); font-weight: 700; }
  .grp.today b { color: var(--accent); }
  /* empty state */
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; display: grid; gap: 8px; justify-items: center; }
  .empty strong { color: var(--text); font-size: 14px; }
  .empty button { margin-top: 6px; height: 32px; padding: 0 16px; background: transparent; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  .empty button:hover { background: var(--accent-soft); }
  /* loading skeletons (shown until the list renders) */
  .skel { height: 112px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border); background: linear-gradient(90deg, var(--card) 30%, #1d1d1d 50%, var(--card) 70%) 0 0 / 300% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px; gap: 14px; }
  .player-wrap { position: relative; width: 100%; max-height: calc(100vh - 40px); aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); margin: 0 auto; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9aa4b6; pointer-events: none; text-align: center; padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay svg { width: 54px; height: 54px; opacity: .6; }
  .overlay.error { color: #FF364E; }
  .vtop { position: absolute; left: 0; top: 0; right: 0; padding: 14px 16px 34px; background: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,0)); display: none; pointer-events: none; z-index: 5; transition: opacity .25s; }
  .player-wrap.has-stream .vtop { display: block; }
  .player-wrap.idle .vtop { opacity: 0; }
  .vtop h2 { margin: 0; max-width: 75%; font-size: 17px; font-weight: 650; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .vtop .sub { margin-top: 3px; color: #d2d2d2; font-size: 12.5px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .qsw { gap: 8px !important; padding: 0 8px !important; }
  .qsw .track { position: relative; width: 34px; height: 18px; border-radius: 999px; background: rgba(255,255,255,.3); transition: background .15s; flex-shrink: 0; }
  .qsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .qsw[aria-checked="true"] .track { background: var(--accent); }
  .qsw[aria-checked="true"] .track::after { transform: translateX(16px); background: #000; }
  .qsw .qlbl { min-width: 32px; text-align: left; }
  .vc { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 8px; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); display: none; flex-direction: column; gap: 4px; transition: opacity .25s; z-index: 5; }
  .player-wrap.has-stream .vc { display: flex; }
  .player-wrap.idle .vc { opacity: 0; pointer-events: none; }
  .player-wrap.idle { cursor: none; }
  .vc .row { display: flex; align-items: center; gap: 6px; }
  .vc button { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 34px; padding: 0 8px; background: transparent; border: 0; border-radius: 8px; color: #fff; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
  .vc button:hover, .vc button:focus-visible { background: rgba(255,255,255,.16); outline: none; }
  .vc button.pill { border: 1px solid rgba(255,255,255,.35); min-width: 52px; }
  .vc button.pill:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
  .vc svg { width: 20px; height: 20px; fill: currentColor; }
  .vc .tm { color: #ddd; font-size: 12.5px; margin-left: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .vc .live { color: #000; background: var(--accent); border-radius: 4px; padding: 1px 6px; font-weight: 700; font-size: 11px; margin-left: 4px; }
  .vc .spacer { flex: 1; }
  .vc input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255,255,255,.3) var(--p, 0%)); outline: none; cursor: pointer; }
  .vc input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 0; }
  .vc input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 0; }
  .vc #seek { width: 100%; margin: 0 0 4px; }
  .vc #vol { width: 80px; }
  .lang-wrap { position: relative; }
  .vc button.pill#langBtn { gap: 6px; padding: 0 10px; }
  .lang-caret { width: 12px !important; height: 12px !important; fill: none !important; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
  #langBtn.open .lang-caret { transform: rotate(180deg); }
  .lang-menu { position: absolute; right: 0; bottom: calc(100% + 8px); min-width: 140px; max-height: 240px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 10; }
  .lang-menu[hidden] { display: none; }
  .vc .lang-item { justify-content: flex-start; height: 32px; width: 100%; font-weight: 500; color: var(--muted); border-radius: 6px; }
  .vc .lang-item:hover { background: #1e1e1e; color: #fff; }
  .vc .lang-item.on { color: var(--accent); font-weight: 700; }
  .vc .row { flex-wrap: wrap; row-gap: 2px; }
  .seek-tip { position: absolute; transform: translateX(-50%); padding: 3px 7px; border-radius: 5px; background: rgba(0,0,0,.85); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; }
  .seek-tip[hidden] { display: none; }
  .spin { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: none; z-index: 4; pointer-events: none; }
  .player-wrap.buffering .spin { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) { .vc #vol { display: none; } .vc .row { gap: 4px; } .vc button.pill { min-width: 44px; padding: 0 6px; } .vc .tm { margin-left: 2px; font-size: 12px; } }

  @media (max-width: 800px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; min-width: 0; height: 50%; border-right: 0; border-top: 1px solid var(--border); }
    main { padding: 12px; }
  }

  body.locked aside, body.locked main { display: none; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 1000; padding: 20px; }
  #lock form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; display: grid; gap: 14px; }
  #lock h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  #lock p { margin: 0; color: var(--muted); font-size: 13px; }
  #lock input { height: 38px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; outline: none; }
  #lock input:focus { border-color: var(--text); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
function boot(DATA) {
  const ROWS = DATA.rows, BASE = DATA.base, SYSTEM_LOGOS = DATA.systemLogos;

const STREAMS = ROWS.map(([name, id, date, system, lang, homeLogo, visitorLogo]) => ({
  name, id, system, lang, homeLogo, visitorLogo,
  date: String(date),   // kick-off in UTC ("2026-11-22T14:30:00Z"); older data has the date only
  high: BASE + id + ",source=100",
  low:  BASE + id + ",source=0"

/* one card per system + game (+ date); its streams are the language options */
const LANG_PREF = ["national", "english", "en-en", "en"];   // default language, first one available wins
const GROUPS = (() => {
  const map = new Map();
  for (const st of STREAMS) {
    const key = st.system + "|" + st.name + "|" + st.date;
    let g = map.get(key);
    if (!g) { g = { key, name: st.name, system: st.system, date: st.date, homeLogo: "", visitorLogo: "", langs: [] }; map.set(key, g); }
    g.homeLogo = g.homeLogo || st.homeLogo; g.visitorLogo = g.visitorLogo || st.visitorLogo;
    g.langs.push(st);
  }
  for (const g of map.values()) {
    g.langs.sort((a, b) => (a.lang || "~").localeCompare(b.lang || "~") || a.id - b.id);   // no-language last
    const seen = {};
    for (const l of g.langs) { const base = l.lang || "Default"; seen[base] = (seen[base] || 0) + 1; l.label = seen[base] > 1 ? base + " (" + seen[base] + ")" : base; }

    for (const pref of LANG_PREF) { const i = g.langs.findIndex(l => (l.lang || "").toLowerCase() === pref); if (i >= 0) { g.def = i; break; } }

})();

const GROUP_BY_KEY = new Map(GROUPS.map(g => [g.key, g]));

/* friendly dates in the viewer's local time: Today / Tomorrow / Sat 28 Nov, the kick-off hour, the day group */
function dayInfo(iso) {

  const time = hasTime ? start.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
  return { diff, label, pretty, time, start: hasTime ? start.getTime() : null, dayKey: dt.getTime() };
}
/* LIVE = between kick-off and the typical game length for the sport (plus a short pre-game window) */
const GAME_MIN = { 72: 210, 2: 165 };   // NFL, NBA in minutes; everything else (soccer) 135
const sysId = s => +((s.match(/\((\d+)\)\s*$/) || [])[1] || 0);
function liveState(x) {
  if (!x.day || x.day.start == null) return "";
  const now = Date.now(), len = (GAME_MIN[sysId(x.system)] || 135) * 6e4;
  if (now >= x.day.start - 10 * 6e4 && now < x.day.start + len) return now < x.day.start ? "soon" : "live";

}
/* Date sort order: today, tomorrow, ... the last day; yesterday (and older) at the end */
const startOf = x => x.day && x.day.start != null ? x.day.start : 0;   // kick-off (ms); no time = start of the day
const dayRank = x => !x.day ? 1e9 : x.day.diff >= 0 ? x.day.diff : 1e6 - x.day.diff;

/* "Home Vs. Visitor[, 18-10-2026, 16:00]" -> ["Home", "Visitor"]; null for other names */
function splitTeams(name) {

  if (p.length !== 2) p = name.split(/\s+[-–]\s+/);   // "Home - Visitor"

function teamLogo(url, team) {

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), overlayMsg = $("overlayMsg");
let current = null, curIdx = 0, quality = "high", hls = null;

/* ---------- multi-select dropdown (staged until Apply; search when > 10 items) ---------- */
const CHECK = '<span class="ms-cb"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,7.5 8.5,2"/></svg></span>';
const msList = [];
function closeAll() { document.querySelectorAll(".dd-panel.open").forEach(p => p.classList.remove("open")); document.querySelectorAll(".dd-btn.open").forEach(b => b.classList.remove("open")); }
document.addEventListener("click", e => { if (!e.target.closest(".dd-wrap")) closeAll(); });

function multiSelect(host, label, items, onPending) {   // items: [{value, text}]
  let pending = new Set(), applied = new Set(), keep = null;   // keep: optional predicate limiting the listed items

      <span class="dd-clear" title="Clear"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></span>
      <svg class="dd-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

const uniq = f => [...new Set(STREAMS.map(f))].sort((a, b) => a.localeCompare(b));
const NONE = "__none";

const fSystem = multiSelect($("filters"), "All systems", uniq(s => s.system).map(v => ({ value: v, text: v, icon: SYSTEM_LOGOS[v] })), syncApply);
function searchBox(host, placeholder, onPending) {
  let pending = "", applied = "";
  const box = document.createElement("div"); box.className = "search-box";
  box.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg><input type="search" autocomplete="off">';

const sysOfGame = new Map();   // system -> lower-cased names of its games
for (const g of GROUPS) { if (!sysOfGame.has(g.system)) sysOfGame.set(g.system, []); sysOfGame.get(g.system).push(g.name.toLowerCase()); }
const fGame = searchBox($("filters"), "Search game name...", () => {
  const q = fGame.current();
  fSystem.limit(q ? (i => (sysOfGame.get(i.value) || []).some(n => n.includes(q))) : null);   // only systems that have a matching game

/* sort: applies immediately (it is not a filter) */
const SORTS = [
  { v: "date",   s: "Date",   t: "Date (today first, then hour, then name)", cmp: (a, b) => dayRank(a) - dayRank(b) || startOf(a) - startOf(b) || a.name.trim().localeCompare(b.name.trim()) || a.system.trim().localeCompare(b.system.trim()) },
  { v: "name",   s: "Name",   t: "Name (A-Z)",          cmp: (a, b) => a.name.trim().localeCompare(b.name.trim()) || a.system.trim().localeCompare(b.system.trim()) },
  { v: "system", s: "System", t: "System (A-Z)",        cmp: (a, b) => a.system.trim().localeCompare(b.system.trim()) || a.name.trim().localeCompare(b.name.trim()) }
];
const SORT_IC = '<svg class="sort-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"/></svg>';
let sortBy = "date";
(function () {
  const wrap = document.createElement("div"); wrap.className = "dd-wrap dd-sort";
  wrap.innerHTML = `<button class="dd-btn" type="button">${SORT_IC}<span class="dd-label"></span>

/* favorites: one-tap toggles for specific systems (matched by the id in "Name (id)") */

  const full = known ? known.replace(/\s*\(\d+\)\s*$/, "").trim() : "";
  b.title = full;
  if (!value) { b.disabled = true; b.title = (full ? full + ": " : "") + "no streams right now"; }
  b.onclick = () => {
    const s = new Set(fSystem.applied()); s.has(value) ? s.delete(value) : s.add(value);
    fSystem.set(s); syncApply(); closeAll(); render();

});
$("favs").addEventListener("wheel", e => {   // mouse wheel scrolls the favorites row sideways
  const el = $("favs"); if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  el.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });
favBtns.filter(f => !f.value).forEach(f => $("favs").appendChild(f.b));   // systems with no games right now go last

}

/* LIVE / starting-soon chips, refreshed every minute without re-rendering the list */
function paintLive() {
  for (const c of document.querySelectorAll(".card[data-key]")) {
    const x = GROUP_BY_KEY.get(c.dataset.key); if (!x) continue;
    const st = liveState(x), chip = c.querySelector(".chip.live");
    c.classList.toggle("is-live", st === "live");
    c.classList.toggle("has-badge", !!st);
    if (!st) { if (chip) chip.remove(); continue; }
    const el = chip || c.appendChild(Object.assign(document.createElement("span"), { className: "chip live" }));   // top-right corner (absolutely positioned)
    el.classList.toggle("soon", st === "soon"); el.textContent = st === "live" ? "LIVE" : "Soon";
  }
}
setInterval(paintLive, 60000);

function card(x) {
  const b = document.createElement("button");
  b.className = "card" + (current && current.key === x.key ? " active" : "");
  b.dataset.key = x.key; b.title = x.name;
  const teams = splitTeams(x.name);
  if (teams) {   // one line per team: logo (or initials) + name
    b.innerHTML = '<div class="match"><div class="side"><span class="tn"></span></div><div class="side"><span class="tn"></span></div></div>';
    b.querySelectorAll(".side").forEach((s, i) => {
      s.querySelector(".tn").textContent = teams[i];
      s.insertBefore(teamLogo(i ? x.visitorLogo : x.homeLogo, teams[i]), s.firstChild);
    });
  } else {
    b.innerHTML = '<div class="top"><div class="teams"></div><div class="title"></div></div>';
    for (const u of [x.homeLogo, x.visitorLogo]) {
      if (!u) continue;

      im.onerror = () => im.remove();

    }
    b.querySelector(".title").textContent = x.name;
  }
  b.insertAdjacentHTML("beforeend", '<div class="system"><img alt=""><span class="sn"></span><span class="now"><span class="eq"><i></i><i></i><i></i></span>Playing</span></div><div class="meta"><span class="chip date"></span></div>');
  b.querySelector(".system .sn").textContent = x.system;
  const si = b.querySelector(".system img");
  if (SYSTEM_LOGOS[x.system]) { si.src = SYSTEM_LOGOS[x.system]; si.onerror = () => si.remove(); } else si.remove();
  const dc = b.querySelector(".date");
  dc.textContent = x.day ? x.day.label + (x.day.time ? " · " + x.day.time : "") : x.date;
  dc.title = x.day ? x.day.pretty + (x.day.time ? ", " + x.day.time + " (your time)" : "") : "";
  if (x.day && x.day.diff === 0) dc.classList.add("today");
  const meta = b.querySelector(".meta"), SHOW = 3;

  const prio = l => { const i = LANG_PREF.indexOf((l.lang || "").toLowerCase()); return i < 0 ? LANG_PREF.length : i; };
  const shown = x.langs.map((l, i) => ({ l, i })).sort((a, b) => (a.i === x.def ? -1 : b.i === x.def ? 1 : 0) || prio(a.l) - prio(b.l) || a.i - b.i).map(o => o.l);
  shown.slice(0, SHOW).forEach(l => { const c = document.createElement("span"); c.className = "chip lang"; c.textContent = l.label; meta.appendChild(c); });

/* no results: say which filters caused it, and offer a one-click reset */
function emptyState(q, sy) {
  const d = document.createElement("div"); d.className = "empty";
  const names = [...sy].map(s => s.replace(/\s*\(\d+\)\s*$/, "").trim());
  const sys = names.length ? (names.length > 2 ? names.slice(0, 2).join(", ") + " +" + (names.length - 2) : names.join(" or ")) : "";
  let why = "No games";
  if (sys) why += " for " + sys;

  d.innerHTML = "<strong></strong><span>The list covers yesterday to 30 days ahead.</span>";
  d.querySelector("strong").textContent = why;
  if (q || sy.size) { const bt = document.createElement("button"); bt.type = "button"; bt.textContent = "Clear filters"; bt.onclick = () => $("resetBtn").click(); d.appendChild(bt); }

function destroyHls() { if (hls) { hls.destroy(); hls = null; } }

/* where we are now, measured from the start of the stream, so a quality / language switch can resume at the same point */
function resumePoint() {
  if (!current || !video.readyState || !(video.currentTime > 0.5)) return null;
  const sk = video.seekable, start = sk && sk.length ? sk.start(0) : 0;
  return { offset: Math.max(0, video.currentTime - start), paused: video.paused };
}

function play(resume) {
  if (!current) return;
  const url = current.langs[curIdx][quality];
  destroyHls();
  overlay.className = "overlay hidden";
  pw.classList.add("buffering");
  // same offset from the start of the new stream, or the last available point when it is not that long yet
  const seekTo = (start, end, live) => {
    if (!resume) return;
    const last = Math.max(start, end - (live ? 3 : 0.5));
    const t = Math.min(start + resume.offset, last);
    if (t > start + 1) video.currentTime = t;
  };
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    let first = true;
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showError("Could not play this stream (" + (d.details || "error") + "). Check your network/VPN access to the stream server."); });
    hls.on(Hls.Events.LEVEL_LOADED, (_, d) => {
      if (!first) return; first = false;
      const det = d.details, f = det.fragments;
      if (f && f.length) seekTo(f[0].start, det.edge != null ? det.edge : f[0].start + det.totalduration, det.live);
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { if (!resume || !resume.paused) video.play().catch(() => {}); });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("loadedmetadata", function once() {
      video.removeEventListener("loadedmetadata", once);
      const sk = video.seekable;
      if (sk && sk.length) seekTo(sk.start(0), sk.end(sk.length - 1), !isFinite(video.duration));
    });
    if (!resume || !resume.paused) video.play().catch(() => {});
  } else {
    showError("This browser cannot play HLS.");
  }
}

function showError(msg) {
  overlayMsg.textContent = msg;
  overlay.className = "overlay error";
  pw.classList.remove("buffering");
}

function select(g, idx) {
  current = g;
  curIdx = idx == null ? g.def : idx;
  pw.classList.add("has-stream"); wake();
  $("nowTitle").textContent = g.name;
  $("nowSub").textContent = g.day ? g.system + " · " + (g.day.diff >= -1 && g.day.diff <= 1 ? g.day.label + ", " + g.day.pretty : g.day.pretty) + (g.day.time ? ", " + g.day.time : "") : g.system;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.key === g.key));
  buildLangMenu();
  play();
}

/* ---------- language toggle in the player ---------- */
function buildLangMenu() {
  const menu = $("langMenu"), l = current.langs[curIdx];
  $("langBtn").parentElement.style.display = current.custom ? "none" : "";
  $("langLbl").textContent = l.label;
  menu.hidden = true; $("langBtn").classList.remove("open");
  menu.replaceChildren();
  current.langs.forEach((x, i) => {
    const it = document.createElement("button");
    it.type = "button"; it.className = "lang-item" + (i === curIdx ? " on" : "");
    it.textContent = x.label;
    it.onclick = e => { e.stopPropagation(); if (i !== curIdx) { const keep = resumePoint(); curIdx = i; buildLangMenu(); play(keep); } else menu.hidden = true; };
    menu.appendChild(it);
  });
}
/* ---------- play a stream by id typed in the box (no language options; quality switch still works) ---------- */
$("customForm").addEventListener("submit", e => {

});

$("langBtn").onclick = e => { e.stopPropagation(); if (!current) return; const m = $("langMenu"); m.hidden = !m.hidden; $("langBtn").classList.toggle("open", !m.hidden); wake(!m.hidden); };

  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const range = () => { const sk = video.seekable; if (sk && sk.length) return [sk.start(0), sk.end(sk.length - 1)]; return [0, isFinite(video.duration) ? video.duration : 0]; };
const setP = (el, f) => el.style.setProperty("--p", (Math.max(0, Math.min(1, f)) * 100) + "%");

}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesToB64 = u => btoa(String.fromCharCode(...u));
async function deriveRaw(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, 256));
}
async function decryptWithRaw(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
(function () {
  const MAX_TRIES = 5, LOCK_MS = 60000, KEY = "lvp_lock", REMEMBER = "lvp_key";
  const remember = document.getElementById("lockRemember");
  const form = document.getElementById("lockForm"), pw = document.getElementById("lockPw"),
        err = document.getElementById("lockErr"), btn = document.getElementById("lockBtn");
  let st = { fails: 0, until: 0 }, timer = null;
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
  const left = () => Math.max(0, st.until - Date.now());

  function tick() {
    const ms = left();
    if (ms > 0) {
      pw.disabled = btn.disabled = true;
      err.textContent = "Too many attempts. Try again in " + Math.ceil(ms / 1000) + "s";
      clearTimeout(timer); timer = setTimeout(tick, 250);
    } else {
      if (st.until) { st = { fails: 0, until: 0 }; save(); }
      pw.disabled = btn.disabled = false; btn.textContent = "Unlock";
      if (/Too many/.test(err.textContent)) err.textContent = "";
      pw.focus();
    }
  }
  tick();

  // returning on a device that was told to remember the key: open straight away
  (async () => {
    try {
      if (!window.crypto || !crypto.subtle) return;
      const saved = JSON.parse(localStorage.getItem(REMEMBER) || "null");
      if (!saved || saved.salt !== ENC.salt || !(Date.now() - saved.t < 30 * 864e5)) { if (saved) localStorage.removeItem(REMEMBER); return; }
      document.getElementById("lock").style.visibility = "hidden";   // remembered device: show the loading list, not the lock form
      document.body.classList.remove("locked");
      const rows = await decryptWithRaw(b64d(saved.key));
      document.body.classList.remove("locked");
      document.getElementById("lock").remove();
      boot(rows);
    } catch (_) {
      try { localStorage.removeItem(REMEMBER); } catch (_) {}
      const l = document.getElementById("lock"); if (l) { l.style.visibility = ""; document.body.classList.add("locked"); }
    }
  })();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (left() > 0) { tick(); return; }
    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking...";
    if (!window.crypto || !crypto.subtle) {
      err.textContent = "Open this page over https (or localhost) to unlock it";
      btn.disabled = false; btn.textContent = "Unlock"; return;
    }
    try {
      const raw = await deriveRaw(pw.value);
      const rows = await decryptWithRaw(raw);
      try { localStorage.removeItem(KEY); } catch (_) {}
      try { if (remember.checked) localStorage.setItem(REMEMBER, JSON.stringify({ salt: ENC.salt, key: bytesToB64(raw), t: Date.now() })); } catch (_) {}
      document.body.classList.remove("locked");
      document.getElementById("lock").remove();
      boot(rows);
    } catch (_) {
      st.fails += 1;
      if (st.fails >= MAX_TRIES) { st.until = Date.now() + LOCK_MS; save(); pw.value = ""; tick(); return; }
      save();
      err.textContent = "Wrong password (" + (MAX_TRIES - st.fails) + " " + (MAX_TRIES - st.fails === 1 ? "try" : "tries") + " left)";
      btn.disabled = false; btn.textContent = "Unlock"; pw.select();
    }
  });
})();
