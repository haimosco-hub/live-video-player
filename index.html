<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Video Player</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #101010; --card: #161616; --card-hover: #1e1e1e;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #8e8e8e;
    --accent: #E5FF00; --accent-soft: rgba(229,255,0,.07); --chip: #1e1e1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; }

  aside { width: 380px; min-width: 380px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .head { padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
  .head h1 { margin: 0 0 12px; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  .filters { display: grid; gap: 8px; }
  .search-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); transition: border-color .15s; }
  .search-box:focus-within { border-color: var(--text); }
  .search-box.has-value { border-color: var(--accent); }
  .search-box svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search-box input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .search-box input::placeholder { color: var(--muted); }
  .dd-wrap { position: relative; }
  .dd-btn { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; transition: border-color .15s; }
  .dd-btn:hover { border-color: #616161; color: var(--text); }
  .dd-btn.open { border-color: var(--text); color: var(--text); }
  .dd-btn.has-value { border-color: var(--accent); color: var(--text); }
  .dd-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .dd-clear { display: none; align-items: center; justify-content: center; width: 14px; height: 14px; color: #616161; }
  .dd-clear:hover { color: var(--text); }
  .dd-clear svg { width: 10px; height: 10px; }
  .dd-btn.has-value .dd-clear { display: flex; }
  .dd-chevron { width: 16px; height: 16px; flex-shrink: 0; transition: transform .15s; }
  .dd-btn.open .dd-chevron { transform: rotate(180deg); }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 100; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .dd-panel.open { display: flex; }
  .dd-panel.has-search { padding: 8px 4px 4px; }
  .dd-search-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; color: var(--muted); }
  .dd-search-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .dd-search-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .dd-search-input::placeholder { color: var(--muted); }
  .dd-divider { height: 1px; background: var(--border); margin: 2px 8px; }
  .dd-items-scroll { max-height: 380px; overflow-y: auto; }   /* 10 rows x 38px, the rest scrolls */
  .dd-items-scroll::-webkit-scrollbar { width: 4px; }
  .dd-items-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .dd-item { display: flex; align-items: center; gap: 8px; height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .dd-item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-item:hover { background: #1e1e1e; color: var(--text); }
  .dd-item.selected { color: var(--text); }
  .dd-item img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .dd-none { padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .ms-cb { width: 16px; height: 16px; border-radius: 2px; border: 1px solid var(--text); flex-shrink: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dd-item.selected .ms-cb { background: var(--text); }
  .ms-cb svg { display: none; width: 10px; height: 10px; color: var(--card); }
  .dd-item.selected .ms-cb svg { display: block; }
  .filter-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .custom { display: flex; gap: 8px; margin-bottom: 12px; }
  .custom input { flex: 1; min-width: 0; height: 32px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; outline: none; }
  .custom input:focus { border-color: var(--text); }
  .custom input.bad { border-color: #FF364E; }
  .custom button { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  .custom button:hover { filter: brightness(.92); }
  .filter-apply-btn { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  .filter-apply-btn:hover:not(:disabled) { filter: brightness(.92); }
  .filter-apply-btn:disabled { background: var(--border); color: #616161; cursor: default; }
  .filter-clear-btn { height: 32px; padding: 0 8px; background: transparent; border: none; font: inherit; color: var(--accent); cursor: pointer; }
  .filter-clear-btn:hover { text-decoration: underline; }
  .count { margin-left: auto; margin-top: 0; color: var(--muted); font-size: 12px; }

  .list, .lang-menu { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .list::-webkit-scrollbar, .lang-menu::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-track, .lang-menu::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb, .lang-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .dd-items-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .dd-sort .dd-label { color: var(--text); }
  .dd-sort .dd-label b { color: var(--muted); font-weight: 500; }
  .dd-sort .dd-item.selected { font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card { text-align: left; width: 100%; background: var(--card); color: inherit; border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; cursor: pointer; font: inherit; transition: background .12s, border-color .12s, transform .12s; }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card.active { border-color: var(--accent); background: var(--accent-soft); }
  .teams { display: flex; gap: 6px; margin-bottom: 9px; }
  .teams { gap: 10px; }
  .teams img { width: 64px; height: 64px; object-fit: contain; background: #ffffff12; border-radius: 50%; padding: 3px; }
  .teams:empty { display: none; }
  .card .title { font-weight: 600; font-size: 14px; margin-bottom: 7px; overflow-wrap: anywhere; }
  .card .system { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin-bottom: 9px; }
  .card .system img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; }
  .chip.lang { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px; gap: 14px; }
  .player-wrap { position: relative; width: 100%; max-height: calc(100vh - 40px); aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); margin: 0 auto; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9aa4b6; pointer-events: none; text-align: center; padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay svg { width: 54px; height: 54px; opacity: .6; }
  .overlay.error { color: #FF364E; }
  .vtop { position: absolute; left: 0; top: 0; right: 0; padding: 14px 16px 34px; background: linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,0)); display: none; pointer-events: none; z-index: 5; transition: opacity .25s; }
  .player-wrap.has-stream .vtop { display: block; }
  .player-wrap.idle .vtop { opacity: 0; }
  .vtop h2 { margin: 0; max-width: 75%; font-size: 17px; font-weight: 650; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .vtop .sub { margin-top: 3px; color: #d2d2d2; font-size: 12.5px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .qsw { gap: 8px !important; padding: 0 8px !important; }
  .qsw .track { position: relative; width: 34px; height: 18px; border-radius: 999px; background: rgba(255,255,255,.3); transition: background .15s; flex-shrink: 0; }
  .qsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .qsw[aria-checked="true"] .track { background: var(--accent); }
  .qsw[aria-checked="true"] .track::after { transform: translateX(16px); background: #000; }
  .qsw .qlbl { min-width: 32px; text-align: left; }
  .vc { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 8px; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); display: none; flex-direction: column; gap: 4px; transition: opacity .25s; z-index: 5; }
  .player-wrap.has-stream .vc { display: flex; }
  .player-wrap.idle .vc { opacity: 0; pointer-events: none; }
  .player-wrap.idle { cursor: none; }
  .vc .row { display: flex; align-items: center; gap: 6px; }
  .vc button { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 34px; padding: 0 8px; background: transparent; border: 0; border-radius: 8px; color: #fff; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
  .vc button:hover, .vc button:focus-visible { background: rgba(255,255,255,.16); outline: none; }
  .vc button.pill { border: 1px solid rgba(255,255,255,.35); min-width: 52px; }
  .vc button.pill:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
  .vc svg { width: 20px; height: 20px; fill: currentColor; }
  .vc .tm { color: #ddd; font-size: 12.5px; margin-left: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .vc .live { color: #000; background: var(--accent); border-radius: 4px; padding: 1px 6px; font-weight: 700; font-size: 11px; margin-left: 4px; }
  .vc .spacer { flex: 1; }
  .vc input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255,255,255,.3) var(--p, 0%)); outline: none; cursor: pointer; }
  .vc input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 0; }
  .vc input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 0; }
  .vc #seek { width: 100%; margin: 0 0 4px; }
  .vc #vol { width: 80px; }
  .lang-wrap { position: relative; }
  .vc button.pill#langBtn { gap: 6px; padding: 0 10px; }
  .lang-caret { width: 12px !important; height: 12px !important; fill: none !important; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
  #langBtn.open .lang-caret { transform: rotate(180deg); }
  .lang-menu { position: absolute; right: 0; bottom: calc(100% + 8px); min-width: 140px; max-height: 240px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 10; }
  .lang-menu[hidden] { display: none; }
  .vc .lang-item { justify-content: flex-start; height: 32px; width: 100%; font-weight: 500; color: var(--muted); border-radius: 6px; }
  .vc .lang-item:hover { background: #1e1e1e; color: #fff; }
  .vc .lang-item.on { color: var(--accent); font-weight: 700; }
  .vc .row { flex-wrap: wrap; row-gap: 2px; }
  @media (max-width: 560px) { .vc #vol { display: none; } .vc .row { gap: 4px; } .vc button.pill { min-width: 44px; padding: 0 6px; } .vc .tm { margin-left: 2px; font-size: 12px; } }

  @media (max-width: 800px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; min-width: 0; height: 50%; border-right: 0; border-top: 1px solid var(--border); }
    main { padding: 12px; }
  }

  body.locked aside, body.locked main { display: none; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 1000; padding: 20px; }
  #lock form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; display: grid; gap: 14px; }
  #lock h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  #lock p { margin: 0; color: var(--muted); font-size: 13px; }
  #lock input { height: 38px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; outline: none; }
  #lock input:focus { border-color: var(--text); }
  #lock button { height: 36px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  #lock button:disabled { opacity: .6; cursor: default; }
  .sr-user { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  #lock label.remember { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; }
  #lock label.remember input { height: auto; width: 16px; accent-color: var(--accent); }
  #lockErr { color: #FF364E; font-size: 13px; min-height: 16px; }
</style>
</head>
<body class="locked">
<div id="lock"><form id="lockForm" method="post" action="#" autocomplete="on">
  <h1>Live Video Player</h1>
  <p>Enter the password to load the stream library.</p>
  <input class="sr-user" type="text" name="username" id="lockUser" value="live-video-player" autocomplete="username" tabindex="-1" aria-hidden="true">
  <input id="lockPw" type="password" name="password" placeholder="Password" autocomplete="current-password">
  <label class="remember"><input type="checkbox" id="lockRemember" checked> Remember this device (30 days)</label>
  <div id="lockErr"></div>
  <button id="lockBtn" type="submit">Unlock</button>
</form></div>


<aside>
  <div class="head">
    <h1>Stream Library</h1>
    <form class="custom" id="customForm" autocomplete="off">
      <input id="customId" type="text" inputmode="numeric" placeholder="Play by stream ID" aria-label="Stream ID" maxlength="12">
      <button type="submit" id="customBtn">Play</button>
    </form>
    <div class="filters" id="filters"></div>
    <div class="filter-actions">
      <button class="filter-apply-btn" id="applyBtn" disabled>Apply</button>
      <button class="filter-clear-btn" id="resetBtn">Reset</button>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="list" id="list"></div>
</aside>

<main>
  <div class="player-wrap" id="pw">
    <video id="video" playsinline preload="none"></video>
    <div class="vtop" id="vtop"><h2 id="nowTitle"></h2><div class="sub" id="nowSub"></div></div>
    <div class="vc" id="vc">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="row">
        <button type="button" id="pp" title="Play / Pause"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button type="button" class="pill" id="back5" title="Back 5 seconds">&minus;5s</button>
        <button type="button" class="pill" id="fwd15" title="Forward 15 seconds">+15s</button>
        <button type="button" id="mute" title="Mute"><svg viewBox="0 0 24 24" id="muteIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <span class="tm" id="tm">0:00</span><span class="live" id="liveTag" hidden>LIVE</span>
        <span class="spacer"></span>
        <button type="button" class="qsw" id="qBtn" role="switch" aria-checked="true" title="Video quality: High / Low"><span class="qlbl" id="qLbl">High</span><span class="track"></span></button>
        <div class="lang-wrap"><button type="button" class="pill" id="langBtn" title="Language"><span id="langLbl">Lang</span><svg viewBox="0 0 16 16" class="lang-caret"><path d="M4 10l4-4 4 4"/></svg></button><div class="lang-menu" id="langMenu" hidden></div></div>
        <button type="button" id="fs" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <div id="overlayMsg">Select a stream from the library to start playing</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
function boot(DATA) {
  const ROWS = DATA.rows, BASE = DATA.base, SYSTEM_LOGOS = DATA.systemLogos;

const STREAMS = ROWS.map(([name, id, date, system, lang, homeLogo, visitorLogo]) => ({
  name, id, system, lang, homeLogo, visitorLogo,
  date: String(date).slice(0, 10),   // date only, no hours
  high: BASE + id + ",source=100",
  low:  BASE + id + ",source=0"
}));

/* one card per system + game (+ date); its streams are the language options */
const LANG_PREF = ["national", "english", "en-en", "en"];   // default language, first one available wins
const GROUPS = (() => {
  const map = new Map();
  for (const st of STREAMS) {
    const key = st.system + "|" + st.name + "|" + st.date;
    let g = map.get(key);
    if (!g) { g = { key, name: st.name, system: st.system, date: st.date, homeLogo: "", visitorLogo: "", langs: [] }; map.set(key, g); }
    g.homeLogo = g.homeLogo || st.homeLogo; g.visitorLogo = g.visitorLogo || st.visitorLogo;
    g.langs.push(st);
  }
  for (const g of map.values()) {
    g.langs.sort((a, b) => (a.lang || "~").localeCompare(b.lang || "~") || a.id - b.id);   // no-language last
    const seen = {};
    for (const l of g.langs) { const base = l.lang || "Default"; seen[base] = (seen[base] || 0) + 1; l.label = seen[base] > 1 ? base + " (" + seen[base] + ")" : base; }
    g.def = 0;
    for (const pref of LANG_PREF) { const i = g.langs.findIndex(l => (l.lang || "").toLowerCase() === pref); if (i >= 0) { g.def = i; break; } }
  }
  return [...map.values()];
})();

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), overlayMsg = $("overlayMsg");
let current = null, curIdx = 0, quality = "high", hls = null;

/* ---------- multi-select dropdown (staged until Apply; search when > 10 items) ---------- */
const CHECK = '<span class="ms-cb"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,7.5 8.5,2"/></svg></span>';
const msList = [];
function closeAll() { document.querySelectorAll(".dd-panel.open").forEach(p => p.classList.remove("open")); document.querySelectorAll(".dd-btn.open").forEach(b => b.classList.remove("open")); }
document.addEventListener("click", e => { if (!e.target.closest(".dd-wrap")) closeAll(); });

function multiSelect(host, label, items, onPending) {   // items: [{value, text}]
  let pending = new Set(), applied = new Set(), keep = null;   // keep: optional predicate limiting the listed items
  const wrap = document.createElement("div"); wrap.className = "dd-wrap";
  wrap.innerHTML = `<button class="dd-btn" type="button"><span class="dd-label"></span>
      <span class="dd-clear" title="Clear"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></span>
      <svg class="dd-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dd-panel"></div>`;
  const btn = wrap.querySelector(".dd-btn"), panel = wrap.querySelector(".dd-panel"), lbl = wrap.querySelector(".dd-label");
  const hasSearch = items.length > 10;
  panel.innerHTML = (hasSearch ? `<div class="dd-search-row"><svg class="dd-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg><input class="dd-search-input" placeholder="Search..."></div><div class="dd-divider"></div>` : "") + `<div class="dd-items-scroll"></div>`;
  if (hasSearch) panel.classList.add("has-search");
  const scroll = panel.querySelector(".dd-items-scroll"), search = panel.querySelector(".dd-search-input");

  function updateLabel() {

/* where we are now, measured from the start of the stream, so a quality / language switch can resume at the same point */
function resumePoint() {
  if (!current || !video.readyState || !(video.currentTime > 0.5)) return null;
  const sk = video.seekable, start = sk && sk.length ? sk.start(0) : 0;

}

function play(resume) {

  overlay.className = "overlay hidden";
  // same offset from the start of the new stream, or the last available point when it is not that long yet
  const seekTo = (start, end, live) => {
    if (!resume) return;
    const last = Math.max(start, end - (live ? 3 : 0.5));
    const t = Math.min(start + resume.offset, last);
    if (t > start + 1) video.currentTime = t;

    hls = new Hls();

    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showError("Could not play this stream (" + (d.details || "error") + "). Check your network/VPN access to the stream server."); });
    hls.on(Hls.Events.LEVEL_LOADED, (_, d) => {

      if (sk && sk.length) seekTo(sk.start(0), sk.end(sk.length - 1), !isFinite(video.duration));
    });

  }
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesToB64 = u => btoa(String.fromCharCode(...u));
async function deriveRaw(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, 256));
}
async function decryptWithRaw(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
(function () {
  const MAX_TRIES = 5, LOCK_MS = 60000, KEY = "lvp_lock", REMEMBER = "lvp_key";
  const remember = document.getElementById("lockRemember");
  const form = document.getElementById("lockForm"), pw = document.getElementById("lockPw"),
        err = document.getElementById("lockErr"), btn = document.getElementById("lockBtn");
  let st = { fails: 0, until: 0 }, timer = null;
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
  const left = () => Math.max(0, st.until - Date.now());

  function tick() {
    const ms = left();
    if (ms > 0) {
      pw.disabled = btn.disabled = true;
      err.textContent = "Too many attempts. Try again in " + Math.ceil(ms / 1000) + "s";
      clearTimeout(timer); timer = setTimeout(tick, 250);
    } else {
      if (st.until) { st = { fails: 0, until: 0 }; save(); }
      pw.disabled = btn.disabled = false; btn.textContent = "Unlock";
      if (/Too many/.test(err.textContent)) err.textContent = "";
      pw.focus();
    }
  }
  tick();

  // returning on a device that was told to remember the key: open straight away
  (async () => {
    try {
      if (!window.crypto || !crypto.subtle) return;
      const saved = JSON.parse(localStorage.getItem(REMEMBER) || "null");
      if (!saved || saved.salt !== ENC.salt || !(Date.now() - saved.t < 30 * 864e5)) { if (saved) localStorage.removeItem(REMEMBER); return; }
      const rows = await decryptWithRaw(b64d(saved.key));
      document.body.classList.remove("locked");
      document.getElementById("lock").remove();
      boot(rows);
    } catch (_) { try { localStorage.removeItem(REMEMBER); } catch (_) {} }
  })();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (left() > 0) { tick(); return; }
    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking...";
    if (!window.crypto || !crypto.subtle) {
      err.textContent = "Open this page over https (or localhost) to unlock it";
      btn.disabled = false; btn.textContent = "Unlock"; return;
    }
    try {
      const raw = await deriveRaw(pw.value);
      const rows = await decryptWithRaw(raw);
      try { localStorage.removeItem(KEY); } catch (_) {}
      try { if (remember.checked) localStorage.setItem(REMEMBER, JSON.stringify({ salt: ENC.salt, key: bytesToB64(raw), t: Date.now() })); } catch (_) {}
      document.body.classList.remove("locked");
      document.getElementById("lock").remove();
      boot(rows);
    } catch (_) {
      st.fails += 1;
      if (st.fails >= MAX_TRIES) { st.until = Date.now() + LOCK_MS; save(); pw.value = ""; tick(); return; }
      save();
      err.textContent = "Wrong password (" + (MAX_TRIES - st.fails) + " " + (MAX_TRIES - st.fails === 1 ? "try" : "tries") + " left)";
      btn.disabled = false; btn.textContent = "Unlock"; pw.select();
    }
  });
})();
