<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Video Player</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #101010; --card: #161616; --card-hover: #1e1e1e;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #8e8e8e;
    --accent: #E5FF00; --accent-soft: rgba(229,255,0,.07); --chip: #1e1e1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; }

  aside { width: 380px; min-width: 380px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .head { padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
  .head h1 { margin: 0 0 12px; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  .filters { display: grid; gap: 8px; }
  .search-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); transition: border-color .15s; }
  .search-box:focus-within { border-color: var(--text); }
  .search-box.has-value { border-color: var(--accent); }
  .search-box svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search-box input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .search-box input::placeholder { color: var(--muted); }
  .dd-wrap { position: relative; }
  .dd-btn { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; transition: border-color .15s; }
  .dd-btn:hover { border-color: #616161; color: var(--text); }
  .dd-btn.open { border-color: var(--text); color: var(--text); }
  .dd-btn.has-value { border-color: var(--accent); color: var(--text); }
  .dd-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .dd-clear { display: none; align-items: center; justify-content: center; width: 14px; height: 14px; color: #616161; }
  .dd-clear:hover { color: var(--text); }
  .dd-clear svg { width: 10px; height: 10px; }
  .dd-btn.has-value .dd-clear { display: flex; }
  .dd-chevron { width: 16px; height: 16px; flex-shrink: 0; transition: transform .15s; }
  .dd-btn.open .dd-chevron { transform: rotate(180deg); }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 100; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .dd-panel.open { display: flex; }
  .dd-panel.has-search { padding: 8px 4px 4px; }
  .dd-search-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; color: var(--muted); }
  .dd-search-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .dd-search-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font: inherit; }
  .dd-search-input::placeholder { color: var(--muted); }
  .dd-divider { height: 1px; background: var(--border); margin: 2px 8px; }
  .dd-items-scroll { max-height: 360px; overflow-y: auto; }
  .dd-items-scroll::-webkit-scrollbar { width: 4px; }
  .dd-items-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .dd-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .dd-item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-item:hover { background: #1e1e1e; color: var(--text); }
  .dd-item.selected { color: var(--text); }
  .dd-item img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .dd-none { padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .ms-cb { width: 16px; height: 16px; border-radius: 2px; border: 1px solid var(--text); flex-shrink: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dd-item.selected .ms-cb { background: var(--text); }
  .ms-cb svg { display: none; width: 10px; height: 10px; color: var(--card); }
  .dd-item.selected .ms-cb svg { display: block; }
  .filter-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .filter-apply-btn { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  .filter-apply-btn:hover:not(:disabled) { filter: brightness(.92); }
  .filter-apply-btn:disabled { background: var(--border); color: #616161; cursor: default; }
  .filter-clear-btn { height: 32px; padding: 0 8px; background: transparent; border: none; font: inherit; color: var(--accent); cursor: pointer; }
  .filter-clear-btn:hover { text-decoration: underline; }
  .count { margin-left: auto; margin-top: 0; color: var(--muted); font-size: 12px; }

  .list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card { text-align: left; width: 100%; background: var(--card); color: inherit; border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; cursor: pointer; font: inherit; transition: background .12s, border-color .12s, transform .12s; }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card.active { border-color: var(--accent); background: var(--accent-soft); }
  .teams { display: flex; gap: 6px; margin-bottom: 9px; }
  .teams { gap: 10px; }
  .teams img { width: 64px; height: 64px; object-fit: contain; background: #ffffff12; border-radius: 50%; padding: 3px; }
  .teams:empty { display: none; }
  .card .title { font-weight: 600; font-size: 14px; margin-bottom: 7px; overflow-wrap: anywhere; }
  .card .system { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin-bottom: 9px; }
  .card .system img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #ffffff12; padding: 2px; flex-shrink: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; }
  .chip.lang { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px; gap: 14px; }
  .player-wrap { position: relative; width: 100%; max-height: calc(100vh - 140px); aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); margin: 0 auto; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9aa4b6; pointer-events: none; text-align: center; padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay svg { width: 54px; height: 54px; opacity: .6; }
  .overlay.error { color: #FF364E; }
  .now { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .now h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .now .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .quality { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .quality button { padding: 7px 14px; background: var(--card); color: var(--muted); border: 0; font: inherit; cursor: pointer; }
  .quality button.on { background: var(--accent); color: #000; font-weight: 600; }

  @media (max-width: 800px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; min-width: 0; height: 50%; border-right: 0; border-top: 1px solid var(--border); }
    main { padding: 12px; }
  }

  body.locked aside, body.locked main { display: none; }
  #lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 1000; padding: 20px; }
  #lock form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; display: grid; gap: 14px; }
  #lock h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; color: var(--accent); text-transform: uppercase; }
  #lock p { margin: 0; color: var(--muted); font-size: 13px; }
  #lock input { height: 38px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; outline: none; }
  #lock input:focus { border-color: var(--text); }
  #lock button { height: 36px; background: var(--accent); border: none; border-radius: 8px; font: inherit; font-weight: 600; color: #000; cursor: pointer; }
  #lock button:disabled { opacity: .6; cursor: default; }
  #lockErr { color: #FF364E; font-size: 13px; min-height: 16px; }
</style>
</head>
<body class="locked">
<div id="lock"><form id="lockForm" autocomplete="off">
  <h1>Live Video Player</h1>
  <p>Enter the password to load the stream library.</p>
  <input id="lockPw" type="password" placeholder="Password" autocomplete="current-password">
  <div id="lockErr"></div>
  <button id="lockBtn" type="submit">Unlock</button>
</form></div>


<aside>
  <div class="head">
    <h1>Stream Library</h1>
    <div class="filters" id="filters"></div>
    <div class="filter-actions">
      <button class="filter-apply-btn" id="applyBtn" disabled>Apply</button>
      <button class="filter-clear-btn" id="resetBtn">Reset</button>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="list" id="list"></div>
</aside>

<main>
  <div class="player-wrap">
    <video id="video" controls playsinline preload="none"></video>
    <div class="overlay" id="overlay">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <div id="overlayMsg">Select a stream from the library to start playing</div>
    </div>
  </div>
  <div class="now" id="now" hidden>
    <div>
      <h2 id="nowTitle"></h2>
      <div class="sub" id="nowSub"></div>
    </div>
    <div class="quality" id="quality">
      <button data-q="high" class="on">High</button>
      <button data-q="low">Low</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
function boot(DATA) {
  const ROWS = DATA.rows, BASE = DATA.base, SYSTEM_LOGOS = DATA.systemLogos;

const STREAMS = ROWS.map(([name, id, date, system, lang, homeLogo, visitorLogo]) => ({
  name, id, system, lang, homeLogo, visitorLogo,
  date: String(date).slice(0, 10),   // date only, no hours
  high: BASE + id + ",source=100",
  low:  BASE + id + ",source=0"
}));

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), overlayMsg = $("overlayMsg");
let current = null, quality = "high", hls = null;

/* ---------- multi-select dropdown (staged until Apply; search when > 10 items) ---------- */
const CHECK = '<span class="ms-cb"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,7.5 8.5,2"/></svg></span>';
const msList = [];
function closeAll() { document.querySelectorAll(".dd-panel.open").forEach(p => p.classList.remove("open")); document.querySelectorAll(".dd-btn.open").forEach(b => b.classList.remove("open")); }
document.addEventListener("click", e => { if (!e.target.closest(".dd-wrap")) closeAll(); });

function multiSelect(host, label, items, onPending) {   // items: [{value, text}]
  let pending = new Set(), applied = new Set();
  const wrap = document.createElement("div"); wrap.className = "dd-wrap";
  wrap.innerHTML = `<button class="dd-btn" type="button"><span class="dd-label"></span>
      <span class="dd-clear" title="Clear"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></span>
      <svg class="dd-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dd-panel"></div>`;
  const btn = wrap.querySelector(".dd-btn"), panel = wrap.querySelector(".dd-panel"), lbl = wrap.querySelector(".dd-label");
  const hasSearch = items.length > 10;
  panel.innerHTML = (hasSearch ? `<div class="dd-search-row"><svg class="dd-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg><input class="dd-search-input" placeholder="Search..."></div><div class="dd-divider"></div>` : "") + `<div class="dd-items-scroll"></div>`;
  if (hasSearch) panel.classList.add("has-search");
  const scroll = panel.querySelector(".dd-items-scroll"), search = panel.querySelector(".dd-search-input");

  function updateLabel() {
    const n = pending.size;
    lbl.textContent = !n ? label : n === 1 ? items.find(i => pending.has(i.value)).text : n + " selected";
    btn.classList.toggle("has-value", n > 0);
  }
  function renderItems() {
    const q = search ? search.value.trim().toLowerCase() : "";
    scroll.replaceChildren();
    const shown = items.filter(i => !q || i.text.toLowerCase().includes(q));
    if (!shown.length) { scroll.innerHTML = '<div class="dd-none">No results</div>'; return; }
    for (const it of shown) {
      const d = document.createElement("div");
      d.className = "dd-item" + (pending.has(it.value) ? " selected" : "");
      d.innerHTML = CHECK + (it.icon ? '<img alt="">' : "") + '<span class="t"></span>'; d.querySelector(".t").textContent = it.text; d.title = it.text;
      if (it.icon) { const ic = d.querySelector("img"); ic.src = it.icon; ic.onerror = () => ic.remove(); }
      d.onclick = () => { pending.has(it.value) ? pending.delete(it.value) : pending.add(it.value); d.classList.toggle("selected", pending.has(it.value)); updateLabel(); onPending(); };
      scroll.appendChild(d);
    }
  }
  btn.onclick = e => {
    if (e.target.closest(".dd-clear")) { pending.clear(); updateLabel(); renderItems(); onPending(); return; }
    const open = panel.classList.contains("open"); closeAll();
    if (!open) { panel.classList.add("open"); btn.classList.add("open"); if (search) { search.value = ""; renderItems(); search.focus(); } }
  };
  if (search) search.oninput = renderItems;
  host.appendChild(wrap); updateLabel(); renderItems();
  const api = {
    applied: () => applied,
    dirty: () => pending.size !== applied.size || [...pending].some(v => !applied.has(v)),
    apply() { applied = new Set(pending); },
    reset() { pending.clear(); applied.clear(); updateLabel(); renderItems(); }
  };
  msList.push(api); return api;
}

const uniq = f => [...new Set(STREAMS.map(f))].sort((a, b) => a.localeCompare(b));
const NONE = "__none";
const syncApply = () => { $("applyBtn").disabled = !msList.some(m => m.dirty()); };
const fSystem = multiSelect($("filters"), "All systems", uniq(s => s.system).map(v => ({ value: v, text: v, icon: SYSTEM_LOGOS[v] })), syncApply);
const fLang = multiSelect($("filters"), "All languages", uniq(s => s.lang || "").map(v => ({ value: v || NONE, text: v || "(no language)" })), syncApply);
function searchBox(host, placeholder, onPending) {
  let pending = "", applied = "";
  const box = document.createElement("div"); box.className = "search-box";
  box.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg><input type="search" autocomplete="off">';
  const input = box.querySelector("input"); input.placeholder = placeholder;
  input.oninput = () => { pending = input.value.trim().toLowerCase(); box.classList.toggle("has-value", !!pending); onPending(); };
  input.onkeydown = e => { if (e.key === "Enter") $("applyBtn").click(); };
  host.appendChild(box);
  const api = { applied: () => applied, dirty: () => pending !== applied, apply() { applied = pending; }, reset() { pending = applied = ""; input.value = ""; box.classList.remove("has-value"); } };
  msList.push(api); return api;
}
const fGame = searchBox($("filters"), "Search game name...", syncApply);
$("applyBtn").onclick = () => { msList.forEach(m => m.apply()); syncApply(); closeAll(); render(); };
$("resetBtn").onclick = () => { msList.forEach(m => m.reset()); syncApply(); closeAll(); render(); };

function render() {
  const g = fGame.applied(), sy = fSystem.applied(), lg = fLang.applied();
  const rows = STREAMS.filter(s => (!g || s.name.toLowerCase().includes(g)) && (!sy.size || sy.has(s.system)) && (!lg.size || lg.has(s.lang || NONE)));
  $("count").textContent = rows.length + " of " + STREAMS.length + " streams";
  const list = $("list");
  list.replaceChildren();
  if (!rows.length) { list.innerHTML = '<div class="empty">No streams match the filters</div>'; return; }
  for (const s of rows) {
    const b = document.createElement("button");
    b.className = "card" + (current && current.id === s.id ? " active" : "");
    b.dataset.id = s.id;
    b.innerHTML = `<div class="teams"></div><div class="title"></div><div class="system"><img alt=""><span></span></div>
      <div class="meta"><span class="chip lang"></span><span class="chip date"></span></div>`;
    for (const u of [s.homeLogo, s.visitorLogo]) {
      if (!u) continue;
      const im = document.createElement("img"); im.src = u; im.alt = ""; im.loading = "lazy";
      im.onerror = () => im.remove();
      b.querySelector(".teams").appendChild(im);
    }
    b.querySelector(".title").textContent = s.name;
    b.querySelector(".system span").textContent = s.system;
    const si = b.querySelector(".system img");
    if (SYSTEM_LOGOS[s.system]) { si.src = SYSTEM_LOGOS[s.system]; si.onerror = () => si.remove(); } else si.remove();
    b.querySelector(".lang").textContent = s.lang || "—";
    b.querySelector(".date").textContent = s.date;
    b.onclick = () => select(s);
    list.appendChild(b);
  }
}

function destroyHls() { if (hls) { hls.destroy(); hls = null; } }

function play() {
  if (!current) return;
  const url = current[quality];
  destroyHls();
  overlay.className = "overlay hidden";
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showError("Could not play this stream (" + (d.details || "error") + "). Check your network/VPN access to the stream server."); });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play().catch(() => {});
  } else {
    showError("This browser cannot play HLS.");
  }
}

function showError(msg) {
  overlayMsg.textContent = msg;
  overlay.className = "overlay error";
}

function select(s) {
  current = s;
  $("now").hidden = false;
  $("nowTitle").textContent = s.name;
  $("nowSub").textContent = s.system + " · " + (s.lang || "—") + " · " + s.date;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.id == s.id));
  play();
}

$("quality").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  quality = b.dataset.q;
  document.querySelectorAll("#quality button").forEach(x => x.classList.toggle("on", x === b));
  play();
};
render();   // nothing plays until a card is clicked

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptRows(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
(function () {
  const MAX_TRIES = 5, LOCK_MS = 60000, KEY = "lvp_lock";
  const form = document.getElementById("lockForm"), pw = document.getElementById("lockPw"),
        err = document.getElementById("lockErr"), btn = document.getElementById("lockBtn");
  let st = { fails: 0, until: 0 }, timer = null;
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
  const left = () => Math.max(0, st.until - Date.now());

  function tick() {
    const ms = left();
    if (ms > 0) {
      pw.disabled = btn.disabled = true;
      err.textContent = "Too many attempts. Try again in " + Math.ceil(ms / 1000) + "s";
      clearTimeout(timer); timer = setTimeout(tick, 250);
    } else {
      if (st.until) { st = { fails: 0, until: 0 }; save(); }
      pw.disabled = btn.disabled = false; btn.textContent = "Unlock";
      if (/Too many/.test(err.textContent)) err.textContent = "";
      pw.focus();
    }
  }
  tick();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (left() > 0) { tick(); return; }
    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking...";
    if (!window.crypto || !crypto.subtle) {
      err.textContent = "Open this page over https (or localhost) to unlock it";
      btn.disabled = false; btn.textContent = "Unlock"; return;
    }
    try {
      const rows = await decryptRows(pw.value);
      try { localStorage.removeItem(KEY); } catch (_) {}
      document.body.classList.remove("locked");
      document.getElementById("lock").remove();
      boot(rows);
    } catch (_) {
      st.fails += 1;
      if (st.fails >= MAX_TRIES) { st.until = Date.now() + LOCK_MS; save(); pw.value = ""; tick(); return; }
      save();
      err.textContent = "Wrong password (" + (MAX_TRIES - st.fails) + " " + (MAX_TRIES - st.fails === 1 ? "try" : "tries") + " left)";
      btn.disabled = false; btn.textContent = "Unlock"; pw.select();
    }
  });
})();
</script>
